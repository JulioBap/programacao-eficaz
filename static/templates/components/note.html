<li class="note-card">
    <h3>{title}</h3>
    <p>{details}</p>
    <div class="note-actions">
        <a class="note-button" href="/update/{id}" name="edit_button">Editar</a>

        <form class="note-action-form" action="/delete" method="POST">
            <input type="hidden" name="id" value="{id}">
            <button class="note-button note-button-danger" type="submit" name="delete_button">Apagar</button>
        </form>
    </div>
</li>
